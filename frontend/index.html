
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetailMax - Inventario Perpetuo</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#003366">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <div class="container">
        <header>
            <h1>RetailMax</h1>
            <p class="subtitle">Inventario Perpetuo</p>
        </header>

        <nav class="tabs">
            <button class="tab active" data-tab="conteo">📷 Conteo</button>
            <button class="tab" data-tab="consulta">Consulta</button>
            <button class="tab" data-tab="historial">Historial</button>
        </nav>

        <!-- Tab: Conteo -->
        <div id="tab-conteo" class="tab-content active">
            <div class="card">
                <h2>Registrar Conteo Físico</h2>
                
                <div class="form-group">
                    <label for="sku-input">Código SKU</label>
                    <div class="input-with-button">
                        <input type="text" id="sku-input" placeholder="Ej: SKU001" autocomplete="off">
                        <button id="scan-btn" class="btn-scan">📷</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="cantidad-input">Cantidad Contada</label>
                    <input type="number" id="cantidad-input" placeholder="0" min="0">
                </div>

                <div id="producto-info" class="producto-info hidden">
                    <h3 id="producto-nombre"></h3>
                    <p id="producto-categoria"></p>
                    <p class="stock-actual">Stock actual: <span id="stock-actual"></span></p>
                </div>

                <button id="registrar-btn" class="btn-primary" disabled>Registrar Conteo</button>
                
                <div id="mensaje-exito" class="mensaje hidden"></div>
            </div>
        </div>

        <!-- Tab: Consulta -->
        <div id="tab-consulta" class="tab-content">
            <div class="card">
                <h2>Consultar Stock</h2>
                
                <div class="form-group">
                    <label for="filtro-categoria">Filtrar por categoría</label>
                    <select id="filtro-categoria">
                        <option value="">Todas</option>
                        <option value="Abarrotes">Abarrotes</option>
                        <option value="Lácteos">Lácteos</option>
                        <option value="Panadería">Panadería</option>
                        <option value="Snacks">Snacks</option>
                    </select>
                </div>

                <div id="inventario-lista" class="inventario-lista">
                    <p class="loading">Cargando inventario...</p>
                </div>
            </div>
        </div>

        <!-- Tab: Historial -->
        <div id="tab-historial" class="tab-content">
            <div class="card">
                <h2>Historial de Conteos</h2>
                <div id="historial-lista" class="historial-lista">
                    <p class="loading">Cargando historial...</p>
                </div>
            </div>
        </div>

        <footer>
            <p>RetailMax MVP - Sprint 1</p>
            <p class="version">v1.0.0</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
